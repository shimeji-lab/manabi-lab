<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まなびラボ">
<meta name="theme-color" content="#16324F">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<title>まなびラボ</title>
<style>
  :root{
    --ink:#16324F;
    --ink-soft:#5C7996;
    --paper:#F7FAFC;
    --grid:#DFE9F1;
    --line:#C6D6E3;
    --amber:#E0982C;
    --amber-soft:#FBEED6;
    --mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    --gothic: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    padding:24px calc(18px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    font-family:var(--gothic); color:var(--ink); font-size:16px;
    -webkit-tap-highlight-color:transparent;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .wrap{max-width:900px; margin:0 auto}

  header{border-bottom:2.5px solid var(--ink); padding-bottom:16px; margin-bottom:6px}
  h1{font-size:30px; margin:0; letter-spacing:.1em; font-weight:700}
  h1 small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.3em; color:var(--ink-soft); font-weight:400; margin-top:6px}
  .lead{font-size:14px; color:var(--ink-soft); margin:12px 0 0; line-height:1.75}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 20px}
  .chip{
    font-family:var(--gothic); font-size:13.5px; padding:8px 16px; min-height:40px; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-radius:20px; color:var(--ink-soft);
    touch-action:manipulation;
  }
  .chip.is-on{background:var(--ink); border-color:var(--ink); color:#fff}
  .chip:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:14px}

  .tool{
    display:flex; gap:14px; align-items:flex-start; text-decoration:none; color:inherit;
    background:#fff; border:1.5px solid var(--ink); border-radius:3px; padding:16px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tool:hover{transform:translateY(-2px); box-shadow:4px 4px 0 var(--line)}
  .tool:focus-visible{outline:2.5px solid var(--amber); outline-offset:2px}
  .tool.is-soon{border-style:dashed; border-color:var(--line); cursor:default}
  .tool.is-soon:hover{transform:none; box-shadow:none}

  .glyph{flex:0 0 62px; width:62px; height:62px}
  .tool.is-soon .glyph{opacity:.38}
  .body h2{font-size:17.5px; margin:0 0 2px; letter-spacing:.03em}
  .tag{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
    padding:3px 8px; border:1px solid var(--line); border-radius:2px; color:var(--ink-soft); margin-bottom:7px;
  }
  .tag.soon{background:var(--amber-soft); border-color:var(--amber); color:#B87516}
  .desc{font-size:13.5px; line-height:1.7; color:var(--ink-soft); margin:0}

  footer{margin-top:28px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft)}
  @media (max-width:520px){
    h1{font-size:25px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>まなびラボ<small>LEARNING TOOLS</small></h1>
    <p class="lead">中学生向けの、動かして確かめる理科・数学の実験室です。カードをえらぶと、そのツールが開きます。</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <footer>ブラウザだけで動きます。ホーム画面に追加しておくと、すぐに開けます。<br><a href="https://shimeji-lab.github.io/" style="color:var(--ink-soft)">← しめじラボ（ほかの作品）</a><span id="ver" style="float:right;font-family:var(--mono)"></span></footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     ツールを追加するときは、この配列に 1 行足すだけです。
       title : カードに出る名前
       tag   : 分類（フィルタのボタンも自動で増えます）
       desc  : ひとこと説明
       url   : リンク先。"" にすると「準備中」表示になります
       glyph : 図の種類（lens / moon / func / wave / salt / gear / dot）
     ============================================================ */
  const VERSION = "v1.3.1";

  var TOOLS = [
    {
      title: "レンズLAB",
      tag: "理科",
      desc: "ろうそく・凸レンズ・スクリーンを動かして、光の進み方と像のでき方を確かめます。",
      url: "https://shimeji-lab.github.io/lens-lab/",
      glyph: "lens"
    },
    {
      title: "月の満ち欠けLAB",
      tag: "理科",
      desc: "太陽・地球・月を 3D で動かして、月の形が変わって見えるしくみを確かめます。（試作版）",
      url: "https://shimeji-lab.github.io/moon-lab/",
      glyph: "moon"
    },
    {
      title: "関数LAB",
      tag: "数学",
      desc: "水そうに水を入れる時間を動かして、水面・表・式・グラフが同じきまりで動くことを確かめます。（試作版）",
      url: "https://shimeji-lab.github.io/function-lab/",
      glyph: "func"
    },
    {
      title: "Wave Lab",
      tag: "理科",
      desc: "水面をタップして波を起こし、反射・回折・干渉のようすを観察します。（試作版）",
      url: "https://wave-lab.vercel.app/",
      glyph: "wave"
    },
    {
      title: "歯車ラボ",
      tag: "理科・数学",
      desc: "かみ合う 2 つの歯車で、歯数と回転数がどう結びつくかを動かしながら確かめます。",
      url: "gear_lab.html?v=1.0.1",
      glyph: "gear"
    },
    {
      title: "食塩水ラボ",
      tag: "数学",
      desc: "食塩水を混ぜたときの濃度と量を、面積図とてんびんの 2 とおりで見くらべます。",
      url: "salt_water_lab.html?v=1.0.1",
      glyph: "salt"
    }
  ];

  /* ---------- カードの図 ---------- */
  var GLYPHS = {
    salt: '<svg viewBox="0 0 64 64" fill="none">' +
      '<rect x="7" y="30" width="21" height="24" fill="#BCDDF0" stroke="#16324F" stroke-width="2.5"/>' +
      '<rect x="28" y="14" width="27" height="40" fill="#2F7BB0" stroke="#16324F" stroke-width="2.5"/>' +
      '<line x1="4" y1="24" x2="60" y2="24" stroke="#E0982C" stroke-width="2.5" stroke-dasharray="6 4"/>' +
      '<line x1="4" y1="54" x2="60" y2="54" stroke="#16324F" stroke-width="2.5"/></svg>',

    gear: '<svg viewBox="0 0 64 64" fill="none">' +
      '<g stroke="#16324F" stroke-width="2.5"><circle cx="23" cy="32" r="14" fill="#BCDDF0"/>' +
      '<circle cx="23" cy="32" r="4.5" fill="#fff"/>' +
      '<path d="M23 14v5M23 45v5M5 32h5M36 32h5M11 20l3.5 3.5M31.5 40.5L35 44M35 20l-3.5 3.5M14.5 40.5L11 44"/>' +
      '<circle cx="49" cy="32" r="9" fill="#E0982C"/><circle cx="49" cy="32" r="3" fill="#fff"/>' +
      '<path d="M49 20v3M49 41v3M58 32h3"/></g></svg>',

    lens: '<svg viewBox="0 0 64 64" fill="none">' +
      '<line x1="3" y1="32" x2="61" y2="32" stroke="#16324F" stroke-width="1.5" opacity=".4"/>' +
      '<path d="M32 10c6 6 6 38 0 44c-6-6-6-38 0-44z" fill="#BCDDF0" stroke="#16324F" stroke-width="2.5"/>' +
      '<path d="M6 20L32 20L54 44M6 20L32 32L54 44" stroke="#E0982C" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<line x1="6" y1="32" x2="6" y2="18" stroke="#16324F" stroke-width="3"/></svg>',

    wave: '<svg viewBox="0 0 64 64" fill="none">' +
      '<circle cx="20" cy="32" r="6" fill="#E0982C" stroke="#16324F" stroke-width="2"/>' +
      '<circle cx="20" cy="32" r="15" stroke="#2F7BB0" stroke-width="2.5"/>' +
      '<circle cx="20" cy="32" r="25" stroke="#2F7BB0" stroke-width="2.5" opacity=".6"/>' +
      '<circle cx="20" cy="32" r="35" stroke="#2F7BB0" stroke-width="2.5" opacity=".3"/>' +
      '<line x1="56" y1="6" x2="56" y2="58" stroke="#16324F" stroke-width="3"/></svg>',

    moon: '<svg viewBox="0 0 64 64" fill="none">' +
      '<circle cx="32" cy="32" r="21" fill="#16324F" stroke="#16324F" stroke-width="2.5"/>' +
      '<path d="M32 11a21 21 0 0 1 0 42a11 21 0 0 0 0-42z" fill="#FBEED6"/>' +
      '<circle cx="32" cy="32" r="21" stroke="#16324F" stroke-width="2.5"/>' +
      '<path d="M2 32h7M4 24l6 3M4 40l6-3" stroke="#E0982C" stroke-width="2.2" stroke-linecap="round"/></svg>',

    func: '<svg viewBox="0 0 64 64" fill="none">' +
      '<path d="M8 6v52h52" stroke="#16324F" stroke-width="2.5"/>' +
      '<path d="M8 22h50M8 38h50M24 6v52M40 6v52" stroke="#16324F" stroke-width="1" opacity=".18"/>' +
      '<line x1="8" y1="46" x2="54" y2="12" stroke="#E0982C" stroke-width="3" stroke-linecap="round"/>' +
      '<line x1="36" y1="25" x2="36" y2="58" stroke="#2F7BB0" stroke-width="2" stroke-dasharray="3 3"/>' +
      '<circle cx="36" cy="25.3" r="5" fill="#BCDDF0" stroke="#16324F" stroke-width="2.5"/></svg>',

    dot: '<svg viewBox="0 0 64 64" fill="none">' +
      '<circle cx="32" cy="32" r="20" fill="#BCDDF0" stroke="#16324F" stroke-width="2.5"/>' +
      '<circle cx="32" cy="32" r="7" fill="#E0982C" stroke="#16324F" stroke-width="2"/></svg>'
  };

  var grid = document.getElementById("grid");
  var filters = document.getElementById("filters");
  var current = "すべて";

  function cardHTML(t){
    var soon = !t.url;
    var g = GLYPHS[t.glyph] || GLYPHS.dot;
    var tag = soon
      ? '<span class="tag soon">準備中</span>'
      : '<span class="tag">' + t.tag + '</span>';
    var inner =
      '<div class="glyph">' + g + '</div>' +
      '<div class="body">' + tag +
        '<h2>' + t.title + '</h2>' +
        '<p class="desc">' + t.desc + '</p>' +
      '</div>';
    return soon
      ? '<div class="tool is-soon">' + inner + '</div>'
      : '<a class="tool" href="' + t.url + '">' + inner + '</a>';
  }

  function draw(){
    var list = TOOLS.filter(function(t){ return current === "すべて" || t.tag === current; });
    grid.innerHTML = list.length
      ? list.map(cardHTML).join("")
      : '<p class="desc">この分類のツールはまだありません。</p>';
    Array.prototype.forEach.call(filters.children, function(b){
      b.classList.toggle("is-on", b.textContent === current);
    });
  }

  var tags = ["すべて"];
  TOOLS.forEach(function(t){ if (tags.indexOf(t.tag) < 0) tags.push(t.tag); });
  filters.innerHTML = tags.map(function(x){ return '<button class="chip">' + x + '</button>'; }).join("");
  Array.prototype.forEach.call(filters.children, function(b){
    b.addEventListener("click", function(){ current = b.textContent; draw(); });
  });

  document.getElementById("ver").textContent = VERSION;
  draw();
})();
</script>
</body>
</html>
